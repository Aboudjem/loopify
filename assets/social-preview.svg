<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="loopify: hand Claude a job that repeats, come back to a log of what every tick did. github.com/Aboudjem/loopify">
  <defs>
    <linearGradient id="s-ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#0A0F1C"/>
      <stop offset="60%" stop-color="#080C16"/>
      <stop offset="100%" stop-color="#07070C"/>
    </linearGradient>
    <radialGradient id="s-bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#FF2D78" stop-opacity="0.26"/>
      <stop offset="38%" stop-color="#7C3AED" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s-brand" x1="0" y1="0" x2="1" y2="0.25" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#2BE8C8"/>
      <stop offset="52%"  stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#5B9DFF"/>
    </linearGradient>
    <linearGradient id="s-mark" gradientUnits="userSpaceOnUse" x1="94" y1="124" x2="186" y2="216">
      <stop offset="0%"   stop-color="#2BE8C8"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="s-horizon" gradientUnits="userSpaceOnUse" x1="90" y1="520" x2="1190" y2="520">
      <stop offset="0%"   stop-color="#2BE8C8" stop-opacity="0"/>
      <stop offset="22%"  stop-color="#2BE8C8" stop-opacity="0.5"/>
      <stop offset="55%"  stop-color="#00D4FF" stop-opacity="0.8"/>
      <stop offset="82%"  stop-color="#FF2D78" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF2D78" stop-opacity="0"/>
    </linearGradient>
    <filter id="s-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1280" height="640" fill="url(#s-ground)"/>
  <ellipse cx="560" cy="680" rx="760" ry="250" fill="url(#s-bloom)"/>

  <line x1="90" y1="520" x2="1190" y2="520" stroke="url(#s-horizon)" stroke-width="1.5"/>

  <!-- mark: orbit ring open at one o'clock, tick mark on the arc -->
  <g stroke="url(#s-mark)" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M172.53 137.47 A46 46 0 1 1 151.91 125.57"/>
    <line x1="111.01" y1="198.99" x2="96.16" y2="213.84"/>
  </g>

  <text class="mono" x="90" y="266" font-size="15" font-weight="600" letter-spacing="5" fill="#2BE8C8">CLAUDE CODE SKILL</text>

  <g filter="url(#s-glow)">
    <text class="disp" x="90" y="378" font-size="118" font-weight="800" letter-spacing="-4" fill="url(#s-brand)">loopify</text>
  </g>

  <text class="disp" x="90" y="440" font-size="26" font-weight="500" fill="#F2F6FF">Hand Claude a job that repeats.</text>
  <text class="disp" x="90" y="478" font-size="26" font-weight="500" fill="#B6C2DA">Come back to a log of what every tick did.</text>

  <text class="mono" x="90" y="584" font-size="20" letter-spacing="1.2" fill="#8494B0">github.com/Aboudjem/loopify</text>

  <!-- reserved: the PNG mark is composited into x 930-1150, y 210-430. Nothing is drawn there. -->
</svg>
