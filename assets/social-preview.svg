<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" fill="none" role="img"
     aria-label="loopify: Hand Claude a job that repeats.">
  <title>loopify</title>
  <defs>
    <linearGradient id="lp-ground" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#0D1626"/>
      <stop offset="55%" stop-color="#0A0F1C"/>
      <stop offset="100%" stop-color="#080C18"/>
    </linearGradient>
    <radialGradient id="lp-bloomA" cx="0.15" cy="0.13" r="0.44">
      <stop offset="0%" stop-color="#2BE8C8" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#2BE8C8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lp-bloomB" cx="0.88" cy="0.85" r="0.50">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lp-bloomC" cx="0.52" cy="0.04" r="0.36">
      <stop offset="0%" stop-color="#5B9DFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#5B9DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lp-wash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#3DFFDA" stop-opacity="0.20"/>
      <stop offset="42%"  stop-color="#00D4FF" stop-opacity="0.124"/>
      <stop offset="76%"  stop-color="#5B9DFF" stop-opacity="0.046"/>
      <stop offset="100%" stop-color="#5B9DFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="lp-frame"><rect width="1280" height="640"/></clipPath>
    <linearGradient id="lp-ink" gradientUnits="userSpaceOnUse" x1="36" y1="170" x2="220" y2="86">
      <stop class="lpk1" offset="0%"   stop-color="#3DFFDA"/>
      <stop class="lpk2" offset="52%"  stop-color="#2BE8C8"/>
      <stop class="lpk3" offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <filter id="lp-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="6.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lp-glow-sm" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="lp-word" x1="0" y1="0" x2="1" y2="0.25">
      <stop class="lpk1" offset="0%"   stop-color="#3DFFDA"/>
      <stop class="lpk2" offset="46%"  stop-color="#2BE8C8"/>
      <stop class="lpk3" offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="lp-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="lp-wordclip">
      <text x="96" y="358" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
            font-size="122" font-weight="800" letter-spacing="-4.3">loopify</text>
    </clipPath>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 4.5px; fill: #3DFFDA; }
    .head    { font-size: 38px; font-weight: 700; fill: #F2F6FF; letter-spacing: -0.5px; }
    .sub     { font-size: 20px; font-weight: 500; fill: #C2CDE4; }
    .tag     { font-size: 15px; letter-spacing: 1.6px; fill: #93A2BE; }
    .chip    { font-size: 11.5px; letter-spacing: 1.2px; fill: #C2CDE4; }
    .chipbig { font-size: 17px; letter-spacing: 1px; fill: #C2CDE4; }
    .tagsm { font-size: 12.5px; letter-spacing: 1.6px; fill: #93A2BE; }
    .eyebrow { font-size: 17px; letter-spacing: 5px; }
            .lpcomet { stroke-dasharray: 200 800; }
    /* led 200/1000 ahead of the dash head, so the dot sits exactly on the comet tip */
    .lphead { transform: translate(47.9px, 104.6px); }
    @media (prefers-reduced-motion: reduce) { * { } }
  </style>

  <rect width="1280" height="640" fill="url(#lp-ground)"/>
  <g class="lpbloom">
    <rect width="1280" height="640" fill="url(#lp-bloomA)"/>
    <rect width="1280" height="640" fill="url(#lp-bloomB)"/>
    <rect width="1280" height="640" fill="url(#lp-bloomC)"/>
  </g>
  <g clip-path="url(#lp-frame)">
    <g transform="translate(0,320)">
      <ellipse class="lpwash" cx="0" cy="0" rx="520" ry="380" fill="url(#lp-wash)"/>
    </g>
  </g>
  <g transform="translate(872,126) scale(1.2188)">
  <path d="M128 128 C114 106 100 90 80 90 C56 90 40 107 40 128 C40 149 56 166 80 166 C100 166 114 150 128 128 C142 106 156 90 176 90 C200 90 216 107 216 128 C216 149 200 166 176 166 C156 166 142 150 128 128 Z" pathLength="1000" fill="none" stroke="#2BE8C8"
        stroke-opacity="0.32" stroke-width="15" stroke-linecap="round"/>
  <g filter="url(#lp-glow)">
    <path class="lpcomet" d="M128 128 C114 106 100 90 80 90 C56 90 40 107 40 128 C40 149 56 166 80 166 C100 166 114 150 128 128 C142 106 156 90 176 90 C200 90 216 107 216 128 C216 149 200 166 176 166 C156 166 142 150 128 128 Z" pathLength="1000" fill="none"
          stroke="url(#lp-ink)" stroke-width="15" stroke-linecap="round"/>
  </g>
  <g class="lphead" filter="url(#lp-glow-sm)"><circle r="8" fill="#FFFFFF"/></g>
  </g>
  <g filter="url(#lp-glow)">
    <text class="disp" x="96" y="358" font-size="122" font-weight="800"
          letter-spacing="-4.3" fill="url(#lp-word)">loopify</text>
  </g>
  <g clip-path="url(#lp-wordclip)">
    <g transform="skewX(-18)">
      <rect class="lpsheen" x="-38" y="236" width="56"
            height="165" fill="url(#lp-sheen)" opacity="0.45"/>
    </g>
  </g>
  <text class="mono eyebrow" x="96" y="258">CLAUDE CODE SKILL</text>
  <text class="disp head" x="96" y="416">Hand Claude a job that repeats.</text>
  <text class="disp sub" x="96" y="458">Come back to a log of what every tick did.</text>
  <text class="mono tag" x="96" y="604">github.com/Aboudjem/loopify</text>
</svg>
