<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="hero-t hero-d">
  <title id="hero-t">Four steps: describe a job that repeats, get a brief (a file) and a line (one string), paste the line into /loop, come back to a tick log.</title>
  <desc id="hero-d">A dark petrol card. Down the left, three numbered beats. One, describe a job that repeats: the command /loopify keep our release PR healthy, check it every 20 minutes. Two, get two things: a pale record sheet labelled BRIEF, a file, pr-babysitter.md; and a violet capsule labelled LINE, one string. Three, paste the line into /loop: the string /loop 20m Run one cycle of ...pr-babysitter.md, ...log the tick. On the right, beat four: a record sheet headed TICKS.md at tick 7 of 30, with five log rows, each carrying a run of tick marks of different heights. A short row is a tick that did nothing. The newest row, tick 7 at 09:40, changed, is still being written by a violet pen. Below: a running loop is not proof, the rows are. Stops at 7 days.</desc>
  <style>
  .sans{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
  .static{display:none}
  @media (prefers-reduced-motion: reduce){.motion{display:none}.static{display:inline}}
  </style>
