  <circle cx="49" cy="192" r="14" fill="none" stroke="#C3ABF2" stroke-width="2"/><text class="mono" x="49" y="198" font-size="18" font-weight="700" fill="#C3ABF2" text-anchor="middle">2</text>
  <circle cx="49" cy="304" r="14" fill="none" stroke="#C3ABF2" stroke-width="2"/><text class="mono" x="49" y="310" font-size="18" font-weight="700" fill="#C3ABF2" text-anchor="middle">3</text>
