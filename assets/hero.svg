  <text class="mono" x="54" y="148" font-size="17" fill="#E8F1EE">/loopify keep our release PR healthy, check it every 20 minutes</text>

  <text class="sans" x="72" y="200" font-size="26" font-weight="700" fill="#E8F1EE">Get two things</text>
  <rect x="36" y="214" width="320" height="70" rx="5" fill="#D7E3E0"/>
  <rect x="36" y="214" width="320" height="12" fill="#C6D5D1"/>
  <text class="sans" x="54" y="250" font-size="20" font-weight="800" fill="#54308C">BRIEF</text>
  <text class="sans" x="338" y="250" font-size="15" font-weight="700" letter-spacing="1.2" fill="#3F585D" text-anchor="end">A FILE</text>
  <text class="mono" x="54" y="274" font-size="17" fill="#0C2A2B">pr-babysitter.md</text>
  <rect x="380" y="214" width="320" height="70" rx="35" fill="#54308C"/>
  <text class="sans" x="406" y="248" font-size="20" font-weight="800" fill="#D7E3E0">LINE</text>
  <text class="sans" x="674" y="248" font-size="15" font-weight="700" letter-spacing="1.2" fill="#D7E3E0" text-anchor="end">ONE STRING</text>
  <text class="mono" x="406" y="272" font-size="17" fill="#E8F1EE">/loop 20m Run one cycle of …</text>

  <text class="sans" x="72" y="312" font-size="26" font-weight="700" fill="#E8F1EE">Paste the line into /loop</text>
  <rect x="36" y="326" width="664" height="46" rx="10" fill="#16403F" stroke="#7E9A9A" stroke-width="1"/>
  <text class="mono" x="54" y="356" font-size="17" fill="#E8F1EE">/loop 20m Run one cycle of …pr-babysitter.md — …log the tick.</text>

  <text class="sans" x="764" y="104" font-size="26" font-weight="700" fill="#E8F1EE">Come back to the log</text>
